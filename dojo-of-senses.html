<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo of Senses - Writing Dojo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        
        /* GALACTIC BACKGROUND ENGINE */
        .galactic-bg {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 20% 35%, rgba(6, 182, 212, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 65%, rgba(99, 102, 241, 0.1) 0%, transparent 40%);
            position: fixed; inset: 0; z-index: -1;
        }

        /* Star Field warp effect */
        .stars-container { position: absolute; inset: 0; pointer-events: none; }
        .star {
            position: absolute; top: 50%; left: 50%; background: white; border-radius: 50%; opacity: 0;
            animation: travelThroughSpace var(--duration) linear infinite;
            animation-delay: var(--delay);
        }
        @keyframes travelThroughSpace {
            0% { transform: translate(-50%, -50%) translate(0, 0) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(-50%, -50%) translate(var(--destX), var(--destY)) scale(var(--endScale)); opacity: 0; }
        }

        @keyframes throwDagger {
            0% { transform: scale(0.5) rotate(-45deg) translate(-500px, 200px); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: scale(1.5) rotate(45deg) translate(0, 0); opacity: 0; }
        }
        .dagger-animating { animation: throwDagger 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; position: absolute; z-index: 50; color: #06b6d4; }
        
        @keyframes textPop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; color: #06b6d4; font-weight: 900; } }
        .forged-text { animation: textPop 0.5s ease-out forwards; font-style: italic; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">
    <div class="galactic-bg">
        <div id="stars" class="stars-container"></div>
    </div>

    <nav class="p-6 flex justify-between items-center bg-[#020617]/80 border-b border-white/5 relative z-40">
        <button onclick="window.location.href='dashboard.html'" class="text-slate-300 hover:text-white flex items-center gap-2 text-xl font-bold transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Back to Dojo
        </button>
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-eye text-cyan-400 text-3xl"></i>
            <h1 class="text-3xl font-black tracking-tight text-white uppercase">Dojo of Senses</h1>
        </div>
        <div class="bg-slate-800/80 px-6 py-2 rounded-full border border-white/10 flex items-center gap-3">
            <!-- TERMINOLOGY UPDATED: Circuit -> Streaks -->
            <span class="text-slate-400 font-bold uppercase tracking-wider text-sm">Streaks</span>
            <span id="streakCounter" class="text-cyan-400 font-black text-2xl">1</span><span class="text-slate-500">/ 5</span>
            <i class="fa-solid fa-fire text-amber-500 text-xl"></i>
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center p-8 relative w-full max-w-6xl mx-auto">
        <i id="flyingDagger" class="fa-solid fa-location-arrow text-6xl hidden drop-shadow-lg rotate-45"></i>
        
        <div id="textDisplayArea" class="text-center w-full mb-12">
            <p id="modeTitle" class="text-cyan-500 text-2xl font-black uppercase tracking-[0.3em] mb-8 italic">Attack the boredom</p>
            <p id="targetSense" class="text-slate-500 text-sm font-black uppercase mb-4 tracking-widest"></p>
            <div id="sentenceContainer" class="text-4xl md:text-6xl font-medium leading-tight text-slate-500 italic px-10"></div>
        </div>

        <div id="interactionArea" class="w-full max-w-4xl space-y-6">
            <p class="text-xl text-slate-300 text-center font-bold">Class, swap the abstract for a sensory fact:</p>
            <div class="flex gap-4">
                <input type="text" id="userInput" placeholder="Show, don't tell..." class="flex-grow bg-slate-900 border-2 border-white/10 text-white text-3xl p-8 rounded-[2rem] text-center focus:border-cyan-500 outline-none transition-colors" autocomplete="off">
                <button onclick="strike()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-black text-2xl uppercase px-12 rounded-[2rem] border-b-8 border-cyan-800 active:border-b-0 active:translate-y-2 transition-all shadow-xl">Show It</button>
            </div>
        </div>

        <div id="successArea" class="hidden flex flex-col items-center gap-8 mt-12">
            <h3 class="text-5xl font-black text-emerald-400 uppercase italic">Sense Awakened!</h3>
            <button onclick="nextDrill()" class="bg-slate-800 hover:bg-slate-700 text-white font-black py-5 px-16 rounded-2xl text-2xl flex items-center gap-4 transition shadow-2xl">
                Next Sense <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </main>

    <script src="content.js"></script>
    <script>
        function createStars() {
            const container = document.getElementById('stars');
            const count = 120;
            const w = window.innerWidth;
            const h = window.innerHeight;
            const maxRadius = Math.sqrt(Math.pow(w/2, 2) + Math.pow(h/2, 2));

            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const angle = Math.random() * Math.PI * 2;
                const destX = Math.cos(angle) * maxRadius;
                const destY = Math.sin(angle) * maxRadius;
                const isHero = Math.random() < 0.05;
                const size = isHero ? (1 + Math.random() * 0.75) : (0.4 + Math.random() * 0.6);
                const duration = isHero ? (2 + Math.random() * 1.5) : (5 + Math.random() * 5); 
                const delay = Math.random() * -10; 
                const endScale = isHero ? 3.5 : 1.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--destX', `${destX}px`);
                star.style.setProperty('--destY', `${destY}px`);
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--delay', `${delay}s`);
                star.style.setProperty('--endScale', endScale);
                container.appendChild(star);
            }
        }

        const senses = DOJO_DATA.unit1.senses;
        let index = 0;

        function loadDrill() {
            const data = senses[index];
            document.getElementById('targetSense').innerText = `Sense: ${data.type}`;
            document.getElementById('sentenceContainer').innerText = `"${data.weak}"`;
            document.getElementById('userInput').value = "";
            document.getElementById('interactionArea').classList.remove('hidden');
            document.getElementById('successArea').classList.add('hidden');
            document.getElementById('streakCounter').innerText = index + 1;
            setTimeout(() => document.getElementById('userInput').focus(), 100);
        }

        function strike() {
            const val = document.getElementById('userInput').value.trim();
            if(!val) return;
            const rect = document.getElementById('sentenceContainer').getBoundingClientRect();
            const d = document.getElementById('flyingDagger');
            d.style.left = `${rect.left + rect.width/2 - 30}px`; d.style.top = `${rect.top - 20}px`;
            d.classList.remove('hidden'); d.classList.add('dagger-animating');
            setTimeout(() => {
                d.classList.add('hidden'); d.classList.remove('dagger-animating');
                document.getElementById('sentenceContainer').innerHTML = `<span class="forged-text">"${val}"</span>`;
                document.getElementById('interactionArea').classList.add('hidden');
                document.getElementById('successArea').classList.remove('hidden');
            }, 500);
        }

        function nextDrill() {
            index++;
            if (index < 5) loadDrill();
            else window.location.href = 'dashboard.html';
        }

        window.onload = function() { createStars(); loadDrill(); };
        window.onresize = () => { document.getElementById('stars').innerHTML = ''; createStars(); };
    </script>
</body>
</html>
