<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Master Scroll - Writing Dojo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Bungee&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .font-bungee { font-family: 'Bungee', cursive; }

        .galactic-bg {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 20% 35%, rgba(245, 158, 11, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 65%, rgba(99, 102, 241, 0.05) 0%, transparent 40%);
            position: fixed; inset: 0; z-index: -1;
        }

        .scroll-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .boring-scroll { background: linear-gradient(to bottom, #1e293b, #0f172a); border-left: 4px solid #f43f5e; }
        .forge-scroll { background: linear-gradient(to bottom, #1e1b4b, #020617); border-left: 4px solid #f59e0b; }

        textarea { background: transparent; resize: none; outline: none; scrollbar-width: none; }
        textarea::-webkit-scrollbar { display: none; }

        .checkpoint-btn { position: relative; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        .checkpoint-active {
            background: #10b981 !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
            border-color: #34d399 !important;
        }
        .checkpoint-active span { color: #020617 !important; font-weight: 900 !important; }
        .checkpoint-active i { color: #020617 !important; }

        @keyframes pulseBorder { 0%, 100% { border-color: rgba(245, 158, 11, 0.2); } 50% { border-color: rgba(245, 158, 11, 0.6); } }
        .forge-pulse { animation: pulseBorder 2s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-white">

    <div class="galactic-bg"></div>

    <nav class="p-6 flex justify-between items-center bg-[#020617]/80 backdrop-blur-sm border-b border-white/5 relative z-40">
        <button onclick="window.location.href='dashboard.html'" class="text-slate-300 hover:text-white flex items-center gap-2 text-xl font-bold transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Back to Dojo
        </button>
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-scroll text-amber-500 text-3xl"></i>
            <h1 class="text-3xl font-black tracking-tight text-white uppercase italic">The Master Scroll</h1>
        </div>
        <button onclick="celebrate()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-8 py-2 rounded-full uppercase text-sm tracking-widest transition shadow-lg">
            Complete Mission
        </button>
    </nav>

    <main class="flex-grow p-8 flex flex-col max-w-[1800px] mx-auto w-full relative z-10">
        <header class="text-center mb-6">
            <h2 class="text-5xl font-black text-white mb-2 uppercase tracking-tighter italic">Attack the boredom</h2>
            <p class="text-slate-400 text-lg font-medium italic">Synthesize your training. Redraft the passage into lethal author prose.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow mb-4">
            <div class="lg:col-span-4 flex flex-col">
                <div class="flex items-center gap-3 mb-4 px-4"><h3 class="text-[10px] font-black text-rose-500 uppercase tracking-[0.3em]">Boring Original</h3></div>
                <div class="scroll-card boring-scroll p-10 rounded-[3rem] flex-grow shadow-2xl relative overflow-hidden">
                    <p id="originalPassage" class="text-xl md:text-2xl leading-relaxed text-slate-400 font-medium italic select-none"></p>
                </div>
            </div>

            <div class="lg:col-span-3 flex flex-col gap-4 justify-center py-4 bg-white/5 rounded-[3rem] border border-white/5 px-6">
                <p class="text-[10px] font-black text-slate-500 uppercase text-center tracking-[0.4em] mb-4">Master Checklist</p>
                <div id="checkpoints" class="space-y-2"></div>
            </div>

            <div class="lg:col-span-5 flex flex-col">
                <div class="flex items-center justify-between mb-4 px-4"><h3 class="text-[10px] font-black text-amber-500 uppercase tracking-[0.3em]">The Sensei's Forge</h3></div>
                <div class="scroll-card forge-scroll p-10 rounded-[3rem] flex-grow shadow-2xl forge-pulse flex flex-col">
                    <textarea id="forgeInput" class="flex-grow text-xl md:text-2xl leading-relaxed text-white font-bold placeholder-white/10" placeholder="Begin the redraft..."></textarea>
                </div>
            </div>
        </div>
    </main>

    <div id="finishOverlay" class="fixed inset-0 bg-[#020617]/95 backdrop-blur-2xl z-[100] hidden flex items-center justify-center p-20">
        <div class="text-center max-w-4xl">
            <i class="fa-solid fa-trophy text-amber-500 text-9xl mb-12 drop-shadow-[0_0_50px_rgba(245,158,11,0.5)]"></i>
            <h2 class="text-8xl font-black text-white uppercase tracking-tighter mb-6 italic">Mission Accomplished</h2>
            <p class="text-slate-400 text-3xl mb-16 font-medium leading-relaxed">The mission is complete. You have mastered this Dojo.</p>
            <button onclick="saveAndReturn()" class="bg-amber-600 hover:bg-amber-500 text-white font-black py-6 px-20 rounded-3xl text-3xl border-b-8 border-amber-900 active:border-b-0 active:translate-y-2 transition-all uppercase tracking-tighter">Return to Dojo</button>
        </div>
    </div>

    <script src="content.js"></script>
    <script>
        const currentUnitKey = localStorage.getItem('dojo_current_unit') || 'unit1';
        const unitData = DOJO_DATA[currentUnitKey] || DOJO_DATA.unit1;
        const masterData = unitData.masterScroll;

        function init() {
            document.getElementById('originalPassage').innerText = masterData.passage;
            document.getElementById('checkpoints').innerHTML = masterData.checkpoints.map(c => `
                <div class="checkpoint-btn w-full p-3 border border-white/10 rounded-2xl text-left flex items-center gap-4 group cursor-pointer" onclick="toggleCheckpoint(this)">
                    <div class="check-box w-6 h-6 border-2 border-white/20 rounded-lg flex items-center justify-center group-hover:border-amber-500 transition-colors"><i class="fa-solid fa-check text-[10px] opacity-0 transition-opacity"></i></div>
                    <span class="text-[10px] font-black uppercase tracking-widest text-slate-400 group-hover:text-white transition-colors">${c.title}</span>
                </div>
            `).join('');
        }

        function toggleCheckpoint(div) { div.classList.toggle('checkpoint-active'); div.querySelector('i').classList.toggle('opacity-0'); }
        function celebrate() { document.getElementById('finishOverlay').classList.remove('hidden'); }
        
        function saveAndReturn() {
            localStorage.setItem(`dojo_done_${currentUnitKey}_scroll`, 'true');
            window.location.href = 'dashboard.html';
        }
        
        window.onload = init;
    </script>
</body>
</html>
