<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verb Shuriken - Writing Dojo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        
        .galactic-bg {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 20% 35%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 65%, rgba(225, 29, 72, 0.1) 0%, transparent 40%);
            position: fixed; inset: 0; z-index: -1;
        }

        @keyframes throwShuriken {
            0% { transform: scale(0.5) rotate(0deg) translate(-500px, 200px); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: scale(1.5) rotate(720deg) translate(0, 0); opacity: 0; }
        }
        .shuriken-animating { animation: throwShuriken 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; position: absolute; z-index: 50; color: #6366f1; }

        .weak-word { color: #fb7185; border-bottom: 4px dashed #fb7185; transition: all 0.3s; cursor: pointer; }
        .weak-word-active { background: rgba(251, 113, 133, 0.2); border-radius: 0.5rem; }
        .word-upgraded { font-weight: 900; color: #6366f1; font-style: italic; animation: textPop 0.5s ease-out forwards; }
        @keyframes textPop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        @keyframes sliceOpen { 0% { transform: translateX(0); } 100% { transform: translateX(150%); } }
        .animate-slice-open { animation: sliceOpen 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-quick-fade { animation: fadeIn 0.4s ease-out forwards; }

        /* ENGINEERING FIX: Locked height for Master Scroll stability */
        #paragraphWrapper { height: 350px; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
    <div class="galactic-bg"></div>

    <nav class="p-6 flex justify-between items-center bg-[#020617]/80 backdrop-blur-sm border-b border-white/5 relative z-40">
        <button onclick="window.location.href='dashboard.html'" class="text-slate-300 hover:text-white flex items-center gap-2 text-xl font-bold transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Back to Dojo
        </button>
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-star text-indigo-400 text-3xl"></i>
            <h1 class="text-3xl font-black tracking-tight text-white uppercase italic">Verb Shuriken</h1>
        </div>
        <div class="bg-slate-800/80 px-6 py-2 rounded-full border border-white/10 flex items-center gap-3">
            <span class="text-slate-400 font-bold uppercase tracking-wider text-sm">Streaks</span>
            <span id="streakCounter" class="text-indigo-400 font-black text-2xl">0</span>
            <i class="fa-solid fa-fire text-amber-500 text-xl"></i>
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-start p-8 relative w-full max-w-6xl mx-auto">
        <div class="w-full flex flex-col items-center my-auto min-h-full">
            
            <i id="flyingShuriken" class="fa-solid fa-certificate text-6xl hidden drop-shadow-lg"></i>

            <div id="textDisplayArea" class="text-center w-full mb-8">
                <p id="modeTitle" class="text-indigo-500 text-2xl font-black uppercase tracking-[0.3em] mb-6 italic">Attack the boredom</p>
                
                <div id="sentenceContainer" class="text-5xl md:text-6xl font-medium leading-tight text-slate-100 min-h-[120px] flex items-center justify-center"></div>
                
                <div id="paragraphWrapper" class="hidden relative max-w-5xl mx-auto overflow-hidden py-4 px-2 rounded-xl bg-slate-900/10 border border-white/5">
                    <div id="paragraphContainer" class="text-2xl md:text-3xl lg:text-4xl font-medium leading-relaxed text-slate-300 text-left h-full overflow-y-auto"></div>
                    <div id="ninjaCover" class="absolute inset-0 bg-slate-950 z-10 border-l-4 border-indigo-500 shadow-[-20px_0_30px_#0f172a] translate-x-0 hidden"></div>
                </div>
            </div>

            <div id="interactionArea" class="w-full max-w-3xl flex flex-col items-center gap-6 animate-quick-fade transition-opacity duration-300">
                <p class="text-2xl text-slate-300">Forge a lethal verb for <span id="targetWordLabel" class="text-rose-400 font-bold uppercase">word</span>:</p>
                <div class="flex w-full gap-4">
                    <input type="text" id="userInput" placeholder="Strike with a verb..." class="flex-grow bg-slate-900 border-2 border-white/10 text-white text-3xl p-6 rounded-2xl text-center focus:border-indigo-500 outline-none transition-colors" autocomplete="off">
                    <button onclick="strike()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black text-2xl uppercase px-12 rounded-2xl border-b-8 border-indigo-800 active:border-b-0 active:translate-y-1 transition-all">Strike</button>
                </div>

                <div class="flex flex-col items-center gap-4 mt-2 h-24">
                    <button onclick="toggleCheatSheet()" class="text-sm font-bold uppercase tracking-widest text-slate-400 hover:text-amber-400 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-lightbulb text-amber-400"></i> <span id="cheatSheetBtnText">Show Cheat Sheet</span>
                    </button>
                    <div id="hintArea" class="hidden text-sm text-amber-200 bg-slate-800/40 backdrop-blur-md px-8 py-6 rounded-3xl border border-white/10 shadow-2xl text-center max-w-2xl leading-relaxed">
                        <div class="grid grid-cols-2 gap-8 text-left">
                            <div>
                                <h4 class="text-indigo-400 font-black uppercase tracking-widest mb-2 text-[10px]">Sensei Rules</h4>
                                <ul class="list-disc list-inside space-y-1 text-slate-300 text-xs">
                                    <li>Banish static 'was' or 'went'</li>
                                    <li>Use cinematic action verbs</li>
                                    <li>Strike with precision!</li>
                                </ul>
                            </div>
                            <div>
                                <h4 class="text-indigo-400 font-black uppercase tracking-widest mb-2 text-[10px]">Word Bank</h4>
                                <p class="text-slate-300 italic leading-snug text-xs">
                                    sprinted, crept, lunged, peered, scanned, clanged, echoed, stifled, suppressed, sliced, sheared
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="nextArea" class="hidden flex-col items-center gap-8 mt-12 w-full"></div>
        </div>
    </main>

    <script src="content.js"></script>
    <script>
        const currentUnitKey = localStorage.getItem('dojo_current_unit') || 'unit1';
        const unitData = typeof DOJO_DATA !== 'undefined' ? DOJO_DATA[currentUnitKey] : { shuriken: { targets: [], paragraph: "" } };
        const shurikenData = unitData.shuriken;

        let streak = 0;
        let currentIndex = -1;
        let isParagraphMode = false;
        let activeTargetSpan = null;

        function init() {
            loadNext();
            document.getElementById('userInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') strike();
            });
        }

        function loadNext() {
            currentIndex++;
            if (currentIndex >= shurikenData.targets.length) currentIndex = 0;
            const item = shurikenData.targets[currentIndex];
            
            document.getElementById('nextArea').classList.add('hidden');
            const ia = document.getElementById('interactionArea');
            
            // ENSURE it's not hidden and is opaque
            ia.classList.remove('hidden');
            ia.style.opacity = "1";
            ia.style.pointerEvents = "auto";
            
            document.getElementById('sentenceContainer').innerHTML = `<span>${item.prefix}</span><span id="target" class="weak-word px-2">${item.weak}</span><span>${item.suffix}</span>`;
            activeTargetSpan = document.getElementById('target');
            document.getElementById('targetWordLabel').innerText = item.weak;
            document.getElementById('userInput').value = '';
            
            setTimeout(() => document.getElementById('userInput').focus(), 100);
        }

        function strike() {
            const val = document.getElementById('userInput').value.trim();
            if (!val || !activeTargetSpan) return;
            const rect = activeTargetSpan.getBoundingClientRect();
            const s = document.getElementById('flyingShuriken');
            s.style.left = `${rect.left + rect.width/2 - 30}px`; s.style.top = `${rect.top - 20}px`;
            s.classList.remove('hidden'); s.classList.add('shuriken-animating');
            
            setTimeout(() => {
                s.classList.add('hidden'); s.classList.remove('shuriken-animating');
                activeTargetSpan.innerText = val; activeTargetSpan.className = 'word-upgraded px-2';
                streak++; document.getElementById('streakCounter').innerText = streak;
                
                const ia = document.getElementById('interactionArea');
                
                if (isParagraphMode) {
                    ia.style.opacity = "0";
                    ia.style.pointerEvents = "none";
                    handleParagraphProgress();
                } else {
                    ia.classList.add('hidden');
                    if (streak === 5) showScrollUnlock();
                    else showSuccess();
                }
            }, 450);
        }

        function toggleCheatSheet() {
            const hintArea = document.getElementById('hintArea');
            const btnText = document.getElementById('cheatSheetBtnText');
            if (hintArea.classList.contains('hidden')) {
                hintArea.classList.remove('hidden');
                btnText.innerText = 'Hide Cheat Sheet';
            } else {
                hintArea.classList.add('hidden');
                btnText.innerText = 'Show Cheat Sheet';
            }
        }

        function showSuccess() {
            const area = document.getElementById('nextArea');
            area.innerHTML = `
                <div class="text-3xl font-black text-indigo-400 italic uppercase">Lethal Action!</div>
                <button onclick="loadNext()" class="bg-slate-800 hover:bg-slate-700 text-white border border-white/10 rounded-2xl px-12 py-5 text-2xl font-bold uppercase flex items-center gap-3 transition">
                    Next Target <i class="fa-solid fa-arrow-right"></i>
                </button>`;
            area.classList.remove('hidden'); area.classList.add('flex');
        }

        function showScrollUnlock() {
            document.getElementById('sentenceContainer').classList.add('hidden');
            const area = document.getElementById('nextArea');
            area.innerHTML = `
                <div class="text-3xl font-black text-amber-400 mb-2 italic">You are ready.</div>
                <button onclick="startMasterScroll()" class="bg-amber-600 hover:bg-amber-500 text-white border-b-8 border-amber-800 rounded-2xl px-12 py-5 text-2xl font-bold uppercase flex items-center gap-3 shadow-2xl transition-all">
                    <i class="fa-solid fa-scroll"></i> Open Master Scroll
                </button>`;
            area.classList.remove('hidden'); area.classList.add('flex');
        }

        function startMasterScroll() {
            isParagraphMode = true;
            document.getElementById('sentenceContainer').classList.add('hidden');
            document.getElementById('paragraphWrapper').classList.remove('hidden');
            document.getElementById('modeTitle').innerText = "Master Scroll: Action Sequence";
            document.getElementById('modeTitle').classList.replace('text-indigo-500', 'text-amber-400');
            
            let idCount = 0;
            document.getElementById('paragraphContainer').innerHTML = shurikenData.paragraph.replace(/\{([^}]+)\}/g, (match, word) => {
                const id = `p_word_${idCount++}`;
                return `<span id="${id}" class="weak-word px-2" onclick="selectParagraphWord('${id}', '${word}')">${word}</span>`;
            });

            const cover = document.getElementById('ninjaCover');
            cover.classList.remove('hidden'); cover.classList.add('animate-slice-open');
            setTimeout(() => { cover.classList.add('hidden'); selectParagraphWord('p_word_0', shurikenData.paragraph.match(/\{([^}]+)\}/)[1]); }, 2600);
        }

        function selectParagraphWord(id, original) {
            if (activeTargetSpan) activeTargetSpan.classList.remove('weak-word-active');
            activeTargetSpan = document.getElementById(id);
            activeTargetSpan.classList.add('weak-word-active');
            document.getElementById('targetWordLabel').innerText = original;
            
            const ia = document.getElementById('interactionArea');
            // THE FIX: Remove hidden and show opacity
            ia.classList.remove('hidden');
            ia.style.opacity = "1";
            ia.style.pointerEvents = "auto";
            
            document.getElementById('nextArea').classList.add('hidden');
            document.getElementById('userInput').value = '';
            setTimeout(() => document.getElementById('userInput').focus(), 100);
        }

        function handleParagraphProgress() {
            const nextWeak = document.getElementById('paragraphContainer').querySelector('.weak-word');
            if (nextWeak) setTimeout(() => selectParagraphWord(nextWeak.id, nextWeak.innerText), 600);
            else {
                localStorage.setItem(`dojo_done_${currentUnitKey}_shuriken`, 'true');
                localStorage.setItem("dojo_pending_reward", 100); 

                const area = document.getElementById('nextArea');
                area.innerHTML = `
                    <div class="text-center py-10 bg-slate-900/40 rounded-[3rem] border border-white/5 w-full">
                        <h3 class="text-6xl font-black text-amber-400 italic uppercase drop-shadow-2xl">Skill Mastered!</h3>
                        <p class="text-slate-400 text-xl font-bold mt-2">Training circuit complete.</p>
                        <button onclick="window.location.href='dashboard.html'" class="bg-slate-800 hover:bg-slate-700 text-white border border-white/10 rounded-[2rem] px-20 py-8 text-3xl font-black uppercase mt-8 transition shadow-2xl">
                            Return to Dojo
                        </button>
                    </div>`;
                area.classList.remove('hidden'); area.classList.add('flex');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
