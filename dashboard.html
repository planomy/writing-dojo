<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Writing Dojo - Teacher Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .font-bungee { font-family: 'Bungee', cursive; }

        .galactic-bg { background-color: #020617; position: fixed; inset: 0; z-index: -1; }

        #dynamic-glow {
            position: absolute; inset: 0;
            transition: all 1s ease;
            background-image: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 80%);
        }

        .stars-container { position: absolute; inset: 0; pointer-events: none; }
        .star {
            position: absolute; top: 50%; left: 50%; background: white; border-radius: 50%; opacity: 0;
            animation: travelThroughSpace var(--duration) linear infinite;
        }
        @keyframes travelThroughSpace {
            0% { transform: translate(-50%, -50%) translate(0, 0) scale(0); opacity: 0; }
            50% { opacity: 0.6; } /* Dimmer peak opacity */
            100% { transform: translate(-50%, -50%) translate(var(--destX), var(--destY)) scale(1.5); opacity: 0; }
        }

        /* STANDARD Tool Cards */
        .glass-card {
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.4s ease;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .grid-card {
            aspect-ratio: 1 / 1; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 1.5rem;
        }
        .glass-card:hover:not(.locked-card) { transform: translateY(-8px); background: rgba(30, 41, 59, 0.7); }

        .completed-card { border: 2px solid #fbbf24 !important; box-shadow: 0 0 30px rgba(251, 191, 36, 0.2); }
        .completed-badge { position: absolute; top: 1rem; right: 1rem; color: #fbbf24; font-size: 1.25rem; animation: badgePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes badgePop { 0% { transform: scale(0); rotate: -45deg; } 100% { transform: scale(1); rotate: 0deg; } }

        .completed-label { position: absolute; bottom: 1rem; left: 0; width: 100%; text-align: center; color: #fbbf24; font-weight: 900; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.2em; opacity: 0.9; }

        .locked-card { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
        .lock-message { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.90); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; z-index: 50; }
        .locked-card:hover .lock-message { opacity: 1; }

        .card-content-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; transform: translateY(-5px); }

        .sensei-desc { position: absolute; opacity: 0; transform: translateY(10px); transition: 0.3s ease; top: 0; left: 0; width: 100%; }
        .glass-card:hover:not(.locked-card) .default-desc { opacity: 0; transform: translateY(-10px); }
        .glass-card:hover:not(.locked-card) .sensei-desc { opacity: 1; transform: translateY(0); position: relative; }

        .coin-box { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .coin-box-reward { transform: scale(1.3); background: rgba(251, 191, 36, 0.2) !important; border-color: #fbbf24 !important; box-shadow: 0 0 40px rgba(251, 191, 36, 0.6); }
    </style>
</head>
<body>
    <div class="galactic-bg"><div id="dynamic-glow"></div><div id="stars" class="stars-container"></div></div>

    <nav class="bg-[#020617]/80 backdrop-blur-md border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-torii-gate text-rose-500 text-3xl"></i>
                <div class="flex flex-col justify-center">
                    <span class="font-black text-[1.4rem] md:text-2xl tracking-tighter text-white uppercase italic leading-none" style="transform: skewX(-5deg);">The Writing Dojo</span>
                    <span class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.25em] mt-1">Sensei Command Center</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div id="coinContainer" class="coin-box flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-4 py-1.5 rounded-full">
                    <i class="fa-solid fa-coins text-amber-500 text-xs"></i>
                    <span id="coinCount" class="font-black text-amber-500 text-xs">0</span>
                    <span class="text-[7px] font-black text-amber-500/60 uppercase tracking-widest hidden md:inline">Ninja Coins</span>
                </div>
                
                <!-- CUSTOM MISSION DROPDOWN -->
                <div class="relative" id="missionDropdownContainer">
                    <button onclick="toggleMissionMenu(event)" class="flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 transition-colors px-5 py-2.5 rounded-full outline-none">
                        <span class="text-[9px] font-black uppercase text-slate-500 tracking-[0.2em] hidden md:inline">Mission:</span>
                        <span id="activeMissionText" class="text-amber-400 font-black uppercase text-[10px] tracking-wider">Loading...</span>
                        <i class="fa-solid fa-chevron-down text-amber-400 text-[10px] ml-2 transition-transform duration-300" id="missionChevron"></i>
                    </button>
                    <!-- Dropdown Menu items injected here -->
                    <div id="missionMenu" class="absolute right-0 top-full mt-3 w-72 bg-slate-900/95 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.8)] overflow-hidden hidden opacity-0 translate-y-[-10px] transition-all duration-300 z-[100]">
                    </div>
                </div>

            </div>
        </div>
    </nav>

    <main class="max-w-[1400px] mx-auto px-6 py-10 flex flex-col items-center">
        <header class="w-full text-left mb-8 max-w-7xl">
            <h1 class="text-4xl font-black text-white uppercase tracking-tighter mb-1 italic">Welcome back, <span id="sensei-color-title" class="text-rose-500">Sensei</span></h1>
            <p class="text-slate-400 text-sm font-medium italic">Master the 8 skills to unlock the final mission redraft.</p>
        </header>
        
        <!-- 2 Rows of 4 Grid -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-7xl mb-8" id="tools-grid"></div>
        
        <!-- Full Width Master Scroll -->
        <div id="master-scroll-container" class="w-full max-w-5xl flex justify-center"></div>
    </main>

    <script>
        // Use var for global availability to avoid temporal dead zone issues
        var currentUnitKey = 'unit1';
        
        // Initialize from storage safely
        try {
            const savedUnit = localStorage.getItem('dojo_current_unit');
            if (savedUnit) currentUnitKey = savedUnit;
        } catch (e) {
            console.warn("Storage access restricted.");
        }

        const DOJO_DATA = {
          unit1: { id: 1, title: "The Rooftop Ninja", themeColor: "indigo" },
          unit2: { id: 2, title: "The Dragon's Lair", themeColor: "orange" }
        };

        const tools = [
            // Row 1
            { id: 'shuriken', file: 'verb-shuriken.html', title: 'Verb Shuriken', desc: 'Banish weak verbs. Master action.', sensei: 'Forces high-octane action verbs for immediate cinematic energy.',
              hoverBorder: 'hover:border-indigo-500/50', hoverShadow: 'hover:shadow-[0_10px_30px_rgba(99,102,241,0.15)]', textColor: 'text-indigo-300',
              svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-indigo-400 drop-shadow-[0_0_15px_rgba(99,102,241,0.6)] group-hover:rotate-180 transition-transform duration-500 mb-4"><path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8Z"/><circle cx="12" cy="12" r="2.5"/></svg>`
            },
            { id: 'daggers', file: 'descriptor-daggers.html', title: 'Descriptor Daggers', desc: 'Layer precise details.', sensei: 'Layer three precise daggers of detail to build deep immersion.',
              hoverBorder: 'hover:border-teal-500/50', hoverShadow: 'hover:shadow-[0_10px_30px_rgba(45,212,191,0.15)]', textColor: 'text-teal-300',
              svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-teal-400 drop-shadow-[0_0_15px_rgba(45,212,191,0.6)] group-hover:translate-x-2 group-hover:-translate-y-2 group-hover:rotate-45 transition-transform duration-300 mb-4"><path d="M19 3L14 8"/><path d="M11 11L16 6L21 3L18 8L13 13Z"/><path d="M11 11L7 15"/><path d="M9 17L7 15"/><circle cx="5" cy="19" r="2"/><path d="M13 9L15 11"/></svg>`
            },
            { id: 'assassin', file: 'filter-word-assassin.html', title: 'Filter Assassin', desc: 'Kill distancing language.', sensei: 'Place reader directly in the skin of the character for impact.',
              hoverBorder: 'hover:border-rose-500/50', hoverShadow: 'hover:shadow-[0_10px_30px_rgba(225,29,72,0.15)]', textColor: 'text-rose-300',
              svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-rose-500 drop-shadow-[0_0_15px_rgba(225,29,72,0.6)] group-hover:rotate-180 transition-transform duration-700 mb-4"><circle cx="12" cy="12" r="10"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M2 12h4"/><path d="M18 12h4"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>`
            },
            { id: 'starters', file: 'stealth-starters.html', title: 'Stealth Starters', desc: 'Break monotonous rhythms.', sensei: 'Teaches narrative rhythm through varied structural entry points.',
              hoverBorder: 'hover:border-emerald-500/50', hoverShadow: 'hover:shadow-[0_10px_30px_rgba(16,185,129,0.15)]', textColor: 'text-emerald-300',
              svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-emerald-400 drop-shadow-[0_0_15px_rgba(16,185,129,0.6)] group-hover:animate-bounce mb-4"><path d="M12 2v3"/><circle cx="12" cy="7" r="2"/><path d="M12 9v11"/><path d="M5 12a7 7 0 0 0 14 0"/><path d="M5 12l2.5 3"/><path d="M19 12l-2.5 3"/></svg>`
            },
            // Row 2
            { id: 'senses', file: 'dojo-of-senses.html', title: 'Dojo of Senses', desc: 'Show, don\'t tell with facts.', sensei: 'Replace abstract emotions with visceral, observable sensory facts.',
              hoverBorder: 'hover:border-cyan-500/50', hoverShadow: 'hover:shadow-[0_10px_30px_rgba(6,182,212,0.15)]', textColor: 'text-cyan-300',
              svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-cyan-400 drop-shadow-[0_0_15px_rgba(6,182,212,0.6)] group-hover:scale-125 transition-transform duration-500 mb-4"><path d="M2 12C2 12 5 5 12 5C19 5 22 12 22 12C22 12 19 19 12 19C5 19 2 12 2 12Z"/><circle cx="12" cy="12" r="4"/><path d="M12 9V15"/></svg>`
            },
            { id: 'lotus', file: 'literary-lotus.html', title: 'Literary Lotus', desc: 'Advanced rhetoric imagery.', sensei: 'Grow metaphors organically from world-building, not as add-ons.',
              hoverBorder: 'hover:border-fuchsia-500/50', hoverShadow: 'hover:shadow-[0_10px_30px_rgba(217,70,239,0.15)]', textColor: 'text-fuchsia-300',
              svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-fuchsia-400 drop-shadow-[0_0_15px_rgba(217,70,239,0.6)] group-hover:rotate-90 group-hover:scale-110 transition-transform duration-700 mb-4"><path d="M12 22C12 22 15 16 15 11C15 6 12 2 12 2C12 2 9 6 9 11C9 16 12 22 12 22Z"/><path d="M12 22C12 22 19 19 22 13C24 9 19 8 19 8C19 8 15 14 12 22Z"/><path d="M12 22C12 22 5 19 2 13C0 9 5 8 5 8C5 8 9 14 12 22Z"/><path d="M12 22C12 22 16 20 18 16C19.5 13 16 12 16 12C16 12 13.5 16 12 22Z"/><path d="M12 22C12 22 8 20 6 16C4.5 13 8 12 8 12C8 12 10.5 16 12 22Z"/></svg>`
            },
            { id: 'katana', file: 'syntax-katana.html', title: 'Syntax Katana', desc: 'Structural blueprints.', sensei: 'Architectural blueprints for professional-grade sentence power.',
              hoverBorder: 'hover:border-blue-500/50', hoverShadow: 'hover:shadow-[0_10px_30px_rgba(59,130,246,0.15)]', textColor: 'text-blue-300',
              svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-blue-400 drop-shadow-[0_0_15px_rgba(59,130,246,0.6)] group-hover:-rotate-45 group-hover:translate-x-2 group-hover:-translate-y-2 transition-transform duration-300 mb-4"><path d="M3 21L7 17"/><path d="M6 14L10 18"/><path d="M8 16C13 11 18 5 22 2C22 2 19 6 15 11C12 14 8 16 8 16Z"/><path d="M4 18L5 19"/></svg>`
            },
            { id: 'path', file: '7-fold-path.html', title: '7-Fold Path', desc: 'Master narrative pacing.', sensei: 'Balance the seven archetypes used by professional authors.',
              hoverBorder: 'hover:border-purple-500/50', hoverShadow: 'hover:shadow-[0_10px_30px_rgba(139,92,246,0.15)]', textColor: 'text-purple-300',
              svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-purple-400 drop-shadow-[0_0_15px_rgba(139,92,246,0.6)] group-hover:-translate-y-3 group-hover:scale-110 transition-transform duration-500 mb-4"><path d="M2 6h20"/><path d="M4 10h16"/><path d="M7 6v14"/><path d="M17 6v14"/><path d="M5 20h4"/><path d="M15 20h4"/><path d="M12 6V10"/></svg>`
            },
            // Master Scroll
            { id: 'scroll', file: 'master-scroll.html', title: 'The Master Scroll', desc: 'Synthesize your training. Redraft a devastatingly flawed paragraph.', sensei: 'Apply the entire arsenal to redraft a complete chapter.',
              svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-20 h-20 text-amber-400 drop-shadow-[0_0_20px_rgba(245,158,11,0.8)] group-hover:scale-110 transition-transform duration-500"><path d="M5 7C5 5.89543 5.89543 5 7 5H17C18.1046 5 19 5.89543 19 7C19 8.1046 18.1046 9 17 9H7C5.89543 9 5 8.1046 5 7Z"/><path d="M5 17C5 18.1046 5.89543 19 7 19H17C18.1046 19 19 18.1046 19 17C19 15.8954 18.1046 15 17 15H7C5.89543 15 5 15.8954 5 17Z"/><path d="M7 9V15"/><path d="M17 9V15"/><path d="M10 12H14"/><path d="M3 7H5"/><path d="M19 7H21"/><path d="M3 17H5"/><path d="M19 17H21"/></svg>`
            }
        ];

        function animateCoins(start, end) {
            const coinEl = document.getElementById('coinCount');
            const box = document.getElementById('coinContainer');
            if (!coinEl || !box) return;
            box.classList.add('coin-box-reward');
            const duration = 2000;
            const startTime = performance.now();
            function update(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                coinEl.innerText = Math.floor(start + (end - start) * progress);
                if (progress < 1) requestAnimationFrame(update);
                else setTimeout(() => box.classList.remove('coin-box-reward'), 500);
            }
            requestAnimationFrame(update);
        }

        function renderDashboard() {
            const unitData = DOJO_DATA[currentUnitKey] || DOJO_DATA.unit1;
            const themeColor = unitData.themeColor;
            const glowColor = themeColor === 'orange' ? '249, 115, 22' : '99, 102, 241';
            
            const glowEl = document.getElementById('dynamic-glow');
            if (glowEl) glowEl.style.backgroundImage = `radial-gradient(circle at 50% 50%, rgba(${glowColor}, 0.15) 0%, transparent 80%)`;
            
            const titleEl = document.getElementById('sensei-color-title');
            if (titleEl) titleEl.style.color = themeColor === 'orange' ? '#f97316' : '#6366f1';

            let completedCount = 0;
            
            // Check completions
            tools.slice(0, 8).forEach(t => {
                try { if (localStorage.getItem(`dojo_done_${currentUnitKey}_${t.id}`) === 'true') completedCount++; } catch (e) {}
            });

            const grid = document.getElementById('tools-grid');
            if (!grid) return;

            // RENDER 8 PRIMARY TOOLS (2 Rows of 4)
            grid.innerHTML = tools.slice(0, 8).map(t => {
                let isDone = false;
                try { isDone = localStorage.getItem(`dojo_done_${currentUnitKey}_${t.id}`) === 'true'; } catch (e) {}

                return `
                    <div onclick="window.location.href='${t.file}'" 
                         class="glass-card grid-card group ${t.hoverBorder} ${t.hoverShadow} ${isDone ? 'completed-card' : ''} rounded-3xl">
                        ${isDone ? '<div class="completed-badge"><i class="fa-solid fa-circle-check"></i></div><div class="completed-label">Mastered</div>' : ''}
                        <div class="card-content-wrapper">
                            ${t.svg}
                            <h3 class="text-base font-black text-white mb-2 uppercase tracking-tight">${t.title}</h3>
                            <div class="relative overflow-hidden w-full px-2">
                                <p class="default-desc text-slate-400 text-[10px] leading-tight">${t.desc}</p>
                                <p class="sensei-desc ${t.textColor} text-[9px] italic leading-tight px-2">"${t.sensei}"</p>
                            </div>
                        </div>
                    </div>`;
            }).join('');
            
            // RENDER MASTER SCROLL (Bottom, Full Width)
            const scrollTool = tools[8];
            const isLocked = completedCount < 8;
            const scrollContainer = document.getElementById('master-scroll-container');
            
            scrollContainer.innerHTML = `
                <a id="card-scroll" ${!isLocked ? `href="${scrollTool.file}"` : ''} class="group w-full glass-card rounded-3xl p-10 flex flex-col md:flex-row items-center justify-between ${isLocked ? 'locked-card border-slate-700' : 'border-amber-500/30 hover:border-amber-500/80 hover:shadow-[0_10px_40px_rgba(245,158,11,0.2)] cursor-pointer'} transition-all duration-700 relative overflow-hidden">
                    ${isLocked ? `<div class="lock-message absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-sm"><i class="fa-solid fa-lock text-5xl text-slate-500 mb-4 drop-shadow-xl"></i><p class="text-slate-400 font-bold tracking-widest uppercase text-sm">Apologies sensei, you must complete all 8 tasks to unlock</p></div>` : ''}
                    <div class="flex flex-col md:flex-row items-center text-center md:text-left gap-8 relative z-10">
                        <div class="relative flex items-center justify-center ${isLocked ? 'opacity-50' : ''} transition-opacity duration-700">
                            ${scrollTool.svg}
                        </div>
                        <div>
                            <h2 class="text-4xl font-black text-white uppercase tracking-tighter italic mb-2 text-glow-amber group-hover:text-amber-400 transition-colors">${scrollTool.title}</h2>
                            <p class="text-lg text-slate-400 font-medium max-w-lg">${scrollTool.desc}</p>
                        </div>
                    </div>
                    <div class="relative z-10 mt-6 md:mt-0">
                        <div class="w-16 h-16 rounded-full border-2 border-amber-500/30 flex items-center justify-center text-amber-500 group-hover:bg-amber-500 group-hover:text-slate-900 transition-all duration-300">
                            <i class="fa-solid fa-arrow-right text-2xl"></i>
                        </div>
                    </div>
                </a>
            `;

            // Handle Coins
            const currentTotal = completedCount * 100;
            let lastTotal = 0;
            try {
                lastTotal = parseInt(localStorage.getItem(`dojo_coins_last_${currentUnitKey}`) || "0");
                localStorage.setItem(`dojo_coins_last_${currentUnitKey}`, currentTotal);
            } catch (e) {}

            if (currentTotal > lastTotal) animateCoins(lastTotal, currentTotal);
            else if (document.getElementById('coinCount')) document.getElementById('coinCount').innerText = currentTotal;
            
            populateDropdown();
        }

        function populateDropdown() {
            const menu = document.getElementById('missionMenu');
            const activeText = document.getElementById('activeMissionText');
            if (!menu || !activeText) return;

            const currentData = DOJO_DATA[currentUnitKey];
            if(currentData) activeText.innerText = `${currentData.id}. ${currentData.title}`;

            menu.innerHTML = Object.keys(DOJO_DATA).map(key => {
                const isSelected = currentUnitKey === key;
                return `
                    <button onclick="selectMission('${key}')" class="w-full text-left px-6 py-5 flex items-center justify-between hover:bg-white/5 transition-colors border-b border-white/5 last:border-b-0 group">
                        <span class="text-xs font-black uppercase tracking-widest ${isSelected ? 'text-amber-400' : 'text-slate-300 group-hover:text-white'}">
                            ${DOJO_DATA[key].id}. ${DOJO_DATA[key].title}
                        </span>
                        ${isSelected ? '<i class="fa-solid fa-check text-amber-400 text-xs"></i>' : ''}
                    </button>
                `;
            }).join('');
        }

        function toggleMissionMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('missionMenu');
            const chevron = document.getElementById('missionChevron');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                // Micro-delay for smooth entry animation
                setTimeout(() => {
                    menu.classList.remove('opacity-0', 'translate-y-[-10px]');
                    chevron.classList.add('rotate-180');
                }, 10);
            } else {
                closeMissionMenu();
            }
        }

        function closeMissionMenu() {
            const menu = document.getElementById('missionMenu');
            const chevron = document.getElementById('missionChevron');
            if (menu && !menu.classList.contains('hidden')) {
                menu.classList.add('opacity-0', 'translate-y-[-10px]');
                chevron.classList.remove('rotate-180');
                setTimeout(() => menu.classList.add('hidden'), 300);
            }
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const container = document.getElementById('missionDropdownContainer');
            if (container && !container.contains(e.target)) {
                closeMissionMenu();
            }
        });

        function selectMission(key) {
            setUnit(key);
            closeMissionMenu();
        }

        function setUnit(key) { 
            currentUnitKey = key; 
            try { localStorage.setItem('dojo_current_unit', key); } catch (e) {}
            renderDashboard(); 
        }

        function createStars() {
            const container = document.getElementById('stars');
            if (!container) return;
            // Dialed back to 25 stars with longer durations for a subtle, distraction-free depth
            for (let i = 0; i < 25; i++) {
                const star = document.createElement('div'); star.className = 'star';
                const angle = Math.random() * Math.PI * 2;
                star.style.setProperty('--destX', `${Math.cos(angle) * window.innerWidth}px`);
                star.style.setProperty('--destY', `${Math.sin(angle) * window.innerHeight}px`);
                star.style.setProperty('--duration', `${15 + Math.random() * 10}s`); // Much slower
                star.style.setProperty('--delay', `${Math.random() * -20}s`);
                star.style.width = star.style.height = '1px';
                star.style.opacity = '0.5'; // Softer
                container.appendChild(star);
            }
        }
        window.onload = () => { createStars(); renderDashboard(); };
    </script>
</body>
</html>
