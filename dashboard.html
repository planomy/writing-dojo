<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Writing Dojo - Teacher Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .font-bungee { font-family: 'Bungee', cursive; }

        .galactic-bg { background-color: #020617; position: fixed; inset: 0; z-index: -1; }

        #dynamic-glow {
            position: absolute; inset: 0;
            transition: all 1s ease;
            background-image: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 80%);
        }

        .stars-container { position: absolute; inset: 0; pointer-events: none; }
        .star {
            position: absolute; top: 50%; left: 50%; background: white; border-radius: 50%; opacity: 0;
            animation: travelThroughSpace var(--duration) linear infinite;
        }
        @keyframes travelThroughSpace {
            0% { transform: translate(-50%, -50%) translate(0, 0) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) translate(var(--destX), var(--destY)) scale(1.5); opacity: 0; }
        }

        .mission-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fbbf24; font-weight: 900; text-transform: uppercase;
            padding: 0.5rem 2.5rem 0.5rem 1rem; border-radius: 9999px;
            appearance: none; cursor: pointer; outline: none; font-size: 0.65rem;
        }

        .dropdown-wrapper { position: relative; display: flex; align-items: center; gap: 10px; }
        .dropdown-wrapper::after {
            content: "\f0d7"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
            color: #fbbf24; pointer-events: none; font-size: 0.75rem;
        }

        /* SQUARE Tool Cards */
        .glass-card {
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.4s ease;
            aspect-ratio: 1 / 1; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; cursor: pointer; position: relative; padding: 1.5rem; overflow: hidden;
        }
        .glass-card:hover:not(.locked-card) { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-8px); background: rgba(30, 41, 59, 0.7); }

        .completed-card { border: 2px solid #fbbf24 !important; box-shadow: 0 0 30px rgba(251, 191, 36, 0.2); }
        .completed-badge { position: absolute; top: 0.75rem; right: 0.75rem; color: #fbbf24; font-size: 1.25rem; animation: badgePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes badgePop { 0% { transform: scale(0); rotate: -45deg; } 100% { transform: scale(1); rotate: 0deg; } }

        .completed-label { position: absolute; bottom: 1rem; left: 0; width: 100%; text-align: center; color: #fbbf24; font-weight: 900; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.2em; opacity: 0.9; }

        .locked-card { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        .lock-message { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; z-index: 50; }
        .locked-card:hover .lock-message { opacity: 1; }

        .card-content-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; transform: translateY(-5px); }

        .sensei-desc { position: absolute; opacity: 0; transform: translateY(10px); transition: 0.3s ease; top: 0; left: 0; width: 100%; }
        .glass-card:hover:not(.locked-card) .default-desc { opacity: 0; transform: translateY(-10px); }
        .glass-card:hover:not(.locked-card) .sensei-desc { opacity: 1; transform: translateY(0); position: relative; }

        .ninja-graphic { width: 60px; height: 60px; filter: drop-shadow(0 0 10px currentColor); transition: all 0.5s ease; margin-bottom: 0.75rem; }
        .coin-box { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .coin-box-reward { transform: scale(1.3); background: rgba(251, 191, 36, 0.2) !important; border-color: #fbbf24 !important; box-shadow: 0 0 40px rgba(251, 191, 36, 0.6); }
    </style>
</head>
<body>
    <div class="galactic-bg"><div id="dynamic-glow"></div><div id="stars" class="stars-container"></div></div>

    <nav class="bg-[#020617]/80 backdrop-blur-md border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-torii-gate text-rose-500 text-2xl"></i>
                <span class="font-bungee text-xl tracking-tighter text-white uppercase italic">The Writing Dojo</span>
            </div>
            <div class="flex items-center gap-6">
                <div id="coinContainer" class="coin-box flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-4 py-1.5 rounded-full">
                    <i class="fa-solid fa-coins text-amber-500 text-xs"></i>
                    <span id="coinCount" class="font-black text-amber-500 text-xs">0</span>
                    <span class="text-[7px] font-black text-amber-500/60 uppercase tracking-widest">Ninja Coins</span>
                </div>
                <div class="dropdown-wrapper">
                    <span class="text-[9px] font-black uppercase text-slate-500 tracking-[0.2em]">Mission:</span>
                    <select id="missionSelector" onchange="setUnit(this.value)" class="mission-select"></select>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-8">
        <header class="mb-6">
            <h1 class="text-4xl font-black text-white uppercase tracking-tighter mb-1 italic">Welcome back, <span id="sensei-color-title" class="text-rose-500">Sensei</span></h1>
            <p class="text-slate-400 text-sm font-medium italic">Master the 8 skills to unlock the final mission redraft.</p>
        </header>
        <div class="grid grid-cols-3 gap-4 lg:gap-6" id="tools-grid"></div>
    </main>

    <script>
        // Use var for global availability to avoid temporal dead zone issues
        var currentUnitKey = 'unit1';
        
        // Initialize from storage safely
        try {
            const savedUnit = localStorage.getItem('dojo_current_unit');
            if (savedUnit) currentUnitKey = savedUnit;
        } catch (e) {
            console.warn("Storage access restricted.");
        }

        const DOJO_DATA = {
          unit1: { id: 1, title: "The Rooftop Ninja", themeColor: "indigo" },
          unit2: { id: 2, title: "The Dragon's Lair", themeColor: "orange" }
        };

        const NINJA_SVGS = {
            shuriken: `<svg viewBox="0 0 100 100" class="ninja-graphic"><circle cx="50" cy="30" r="10" fill="currentColor"/><path d="M40 40h20l5 30H35z" fill="currentColor"/><path d="M60 45l15-5 5 5-15 10zM35 45L15 60l5 5 20-15z" fill="currentColor"/></svg>`,
            daggers: `<svg viewBox="0 0 100 100" class="ninja-graphic"><circle cx="50" cy="25" r="8" fill="currentColor"/><path d="M42 35h16l2 25-20 0z" fill="currentColor"/><path d="M35 35L20 50l3 3 15-12zM65 35l15 15-3 3-15-12z" fill="currentColor"/></svg>`,
            assassin: `<svg viewBox="0 0 100 100" class="ninja-graphic"><circle cx="45" cy="35" r="8" fill="currentColor"/><path d="M35 45h25l-5 15H30z" fill="currentColor"/><path d="M60 40l20-10-2-4-15 8z" fill="currentColor"/></svg>`,
            starters: `<svg viewBox="0 0 100 100" class="ninja-graphic"><circle cx="70" cy="30" r="8" fill="currentColor"/><path d="M60 40l-20 10 5 20 20-5z" fill="currentColor"/></svg>`,
            senses: `<svg viewBox="0 0 100 100" class="ninja-graphic"><circle cx="50" cy="30" r="10" fill="currentColor"/><path d="M40 45h20v30H40z" fill="currentColor"/></svg>`,
            lotus: `<svg viewBox="0 0 100 100" class="ninja-graphic"><circle cx="50" cy="30" r="8" fill="currentColor"/><path d="M40 40h20l-5 20H45z" fill="currentColor"/></svg>`,
            katana: `<svg viewBox="0 0 100 100" class="ninja-graphic"><circle cx="40" cy="30" r="8" fill="currentColor"/><path d="M35 40h15l10 30H30z" fill="currentColor"/></svg>`,
            path: `<svg viewBox="0 0 100 100" class="ninja-graphic"><circle cx="50" cy="30" r="8" fill="currentColor"/><path d="M45 40h10l5 40h-20z" fill="currentColor"/></svg>`,
            scroll: `<svg viewBox="0 0 100 100" class="ninja-graphic"><circle cx="50" cy="30" r="10" fill="currentColor"/><path d="M40 45h20v25H40z" fill="currentColor"/><rect x="30" y="65" width="40" height="15" rx="5" fill="#fbbf24"/></svg>`
        };

        const tools = [
            { id: 'shuriken', color: 'indigo', file: 'verb-shuriken.html', svg: 'shuriken', title: 'Verb Shuriken', desc: 'Banish weak verbs. Master action.', sensei: 'Forces high-octane action verbs for immediate cinematic energy.' },
            { id: 'daggers', color: 'teal', file: 'descriptor-daggers.html', svg: 'daggers', title: 'Descriptor Daggers', desc: 'Layer precise details.', sensei: 'Layer three precise daggers of detail to build deep immersion.' },
            { id: 'assassin', color: 'rose', file: 'filter-word-assassin.html', svg: 'assassin', title: 'Filter Assassin', desc: 'Kill distancing language.', sensei: 'Place reader directly in the skin of the character for impact.' },
            { id: 'starters', color: 'emerald', file: 'stealth-starters.html', svg: 'starters', title: 'Stealth Starters', desc: 'Break monotonous rhythms.', sensei: 'Teaches narrative rhythm through varied structural entry points.' },
            { id: 'senses', color: 'cyan', file: 'dojo-of-senses.html', svg: 'senses', title: 'Dojo of Senses', desc: 'Show, don\'t tell with facts.', sensei: 'Replace abstract emotions with visceral, observable sensory facts.' },
            { id: 'lotus', color: 'fuchsia', file: 'literary-lotus.html', svg: 'lotus', title: 'Literary Lotus', desc: 'Advanced rhetoric imagery.', sensei: 'Grow metaphors organically from world-building, not as add-ons.' },
            { id: 'katana', color: 'blue', file: 'syntax-katana.html', svg: 'katana', title: 'Syntax Katana', desc: 'Structural blueprints.', sensei: 'Architectural blueprints for professional-grade sentence power.' },
            { id: 'path', color: 'violet', file: '7-fold-path.html', svg: 'path', title: '7-Fold Path', desc: 'Master narrative pacing.', sensei: 'Balance the seven archetypes used by professional authors.' },
            { id: 'scroll', color: 'amber', file: 'master-scroll.html', svg: 'scroll', title: 'Master Scroll', desc: 'The final boss synthesis.', sensei: 'Apply the entire arsenal to redraft a complete chapter.' }
        ];

        function animateCoins(start, end) {
            const coinEl = document.getElementById('coinCount');
            const box = document.getElementById('coinContainer');
            if (!coinEl || !box) return;
            box.classList.add('coin-box-reward');
            const duration = 2000;
            const startTime = performance.now();
            function update(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                coinEl.innerText = Math.floor(start + (end - start) * progress);
                if (progress < 1) requestAnimationFrame(update);
                else setTimeout(() => box.classList.remove('coin-box-reward'), 500);
            }
            requestAnimationFrame(update);
        }

        function renderDashboard() {
            const unitData = DOJO_DATA[currentUnitKey] || DOJO_DATA.unit1;
            const themeColor = unitData.themeColor;
            const glowColor = themeColor === 'orange' ? '249, 115, 22' : '99, 102, 241';
            
            const glowEl = document.getElementById('dynamic-glow');
            if (glowEl) glowEl.style.backgroundImage = `radial-gradient(circle at 50% 50%, rgba(${glowColor}, 0.15) 0%, transparent 80%)`;
            
            const titleEl = document.getElementById('sensei-color-title');
            if (titleEl) titleEl.style.color = themeColor === 'orange' ? '#f97316' : '#6366f1';

            let completedCount = 0;
            const grid = document.getElementById('tools-grid');
            if (!grid) return;

            grid.innerHTML = tools.map(t => {
                const isScroll = t.id === 'scroll';
                let isDone = false;
                try {
                    isDone = localStorage.getItem(`dojo_done_${currentUnitKey}_${t.id}`) === 'true';
                } catch (e) {}

                if (isDone && !isScroll) completedCount++;
                const isLocked = isScroll && completedCount < 8;

                return `
                    <div onclick="${isLocked ? '' : `window.location.href='${t.file}'`}" 
                         class="glass-card group ${isDone ? 'completed-card' : ''} ${isLocked ? 'locked-card' : ''} rounded-[2rem]">
                        ${isDone ? '<div class="completed-badge"><i class="fa-solid fa-circle-check"></i></div><div class="completed-label">Mastered</div>' : ''}
                        ${isLocked ? `<div class="lock-message rounded-[2rem]"><i class="fa-solid fa-lock text-3xl text-amber-500 mb-2"></i><p class="text-white font-black uppercase text-[8px] tracking-widest px-4 text-center">Complete 8 tasks</p></div>` : ''}
                        <div class="card-content-wrapper">
                            <div class="transition-all duration-500 text-${t.color}-400 group-hover:text-white flex justify-center">${NINJA_SVGS[t.svg]}</div>
                            <h3 class="text-base font-black text-white mb-2 uppercase tracking-tight">${t.title}</h3>
                            <div class="relative overflow-hidden w-full px-2">
                                <p class="default-desc text-slate-400 text-[9px] leading-tight">${isLocked ? 'Locked until mastery.' : t.desc}</p>
                                <p class="sensei-desc text-${t.color}-300 text-[8px] italic leading-tight px-2">"${t.sensei}"</p>
                            </div>
                        </div>
                    </div>`;
            }).join('');
            
            const currentTotal = completedCount * 100;
            let lastTotal = 0;
            try {
                lastTotal = parseInt(localStorage.getItem(`dojo_coins_last_${currentUnitKey}`) || "0");
                localStorage.setItem(`dojo_coins_last_${currentUnitKey}`, currentTotal);
            } catch (e) {}

            if (currentTotal > lastTotal) animateCoins(lastTotal, currentTotal);
            else if (document.getElementById('coinCount')) document.getElementById('coinCount').innerText = currentTotal;
            
            populateDropdown();
        }

        function populateDropdown() {
            const select = document.getElementById('missionSelector');
            if (!select) return;
            select.innerHTML = Object.keys(DOJO_DATA).map(key => `<option value="${key}" ${currentUnitKey === key ? 'selected' : ''}>${DOJO_DATA[key].id}. ${DOJO_DATA[key].title}</option>`).join('');
        }

        function setUnit(key) { 
            currentUnitKey = key; 
            try {
                localStorage.setItem('dojo_current_unit', key); 
            } catch (e) {}
            renderDashboard(); 
        }

        function createStars() {
            const container = document.getElementById('stars');
            if (!container) return;
            for (let i = 0; i < 40; i++) {
                const star = document.createElement('div'); star.className = 'star';
                const angle = Math.random() * Math.PI * 2;
                star.style.setProperty('--destX', `${Math.cos(angle) * window.innerWidth}px`);
                star.style.setProperty('--destY', `${Math.sin(angle) * window.innerHeight}px`);
                star.style.setProperty('--duration', `${5 + Math.random() * 5}s`);
                star.style.setProperty('--delay', `${Math.random() * -10}s`);
                star.style.width = star.style.height = '1px';
                container.appendChild(star);
            }
        }
        window.onload = () => { createStars(); renderDashboard(); };
    </script>
</body>
</html>
