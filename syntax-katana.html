<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Syntax Katana - Writing Dojo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Bungee&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .font-bungee { font-family: 'Bungee', cursive; }

        .galactic-bg {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 20% 35%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 65%, rgba(147, 51, 234, 0.08) 0%, transparent 40%);
            position: fixed; inset: 0; z-index: -1;
        }

        /* PREMIUM SQUARE MINI-DASHBOARD CARDS */
        .katana-card {
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.4s ease;
            cursor: pointer; aspect-ratio: 1/1; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; padding: 2rem; border-radius: 2.5rem;
        }
        .katana-card:hover { border-color: rgba(59, 130, 246, 0.4); transform: translateY(-8px); background-color: rgba(30, 41, 59, 0.7); }

        .card-content-wrapper { transform: translateY(-10px); display: flex; flex-direction: column; align-items: center; }

        .forged-text { font-weight: 900; color: #3b82f6; font-style: italic; animation: textPop 0.5s ease-out forwards; }
        @keyframes textPop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        @keyframes sliceOpen { 0% { transform: translateX(0); } 100% { transform: translateX(150%); } }
        .animate-slice-open { animation: sliceOpen 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        .hint-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">
    <div class="galactic-bg"></div>

    <nav class="p-6 flex justify-between items-center bg-[#020617]/80 backdrop-blur-sm border-b border-white/5 relative z-40">
        <button onclick="window.location.href='dashboard.html'" class="text-slate-300 hover:text-white flex items-center gap-2 text-xl font-bold transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Back to Dojo
        </button>
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-khanda text-blue-400 text-3xl"></i>
            <h1 class="text-3xl font-black tracking-tight text-white uppercase italic">Syntax Katana</h1>
        </div>
        <div class="bg-slate-800/80 px-6 py-2 rounded-full border border-white/10 flex items-center gap-3">
            <span class="text-slate-400 font-bold uppercase tracking-wider text-sm">Streaks</span>
            <span id="streakCounter" class="text-blue-400 font-black text-2xl">0</span>
            <i class="fa-solid fa-fire text-amber-500 text-xl"></i>
        </div>
    </nav>

    <!-- MINI-DASHBOARD GRID -->
    <main id="selectionStage" class="flex-grow flex flex-col items-center p-12 max-w-7xl mx-auto w-full">
        <header class="text-center mb-12">
            <h2 class="text-5xl font-black text-white mb-4 uppercase tracking-tighter italic">Master the Blade</h2>
            <p class="text-slate-400 text-xl max-w-2xl mx-auto font-medium font-bold">Slice through clunky sentences and forge sharper structures.</p>
        </header>
        <div id="katanaGrid" class="grid grid-cols-2 md:grid-cols-4 gap-8 w-full"></div>
    </main>

    <!-- PRACTICE STAGE -->
    <main id="practiceStage" class="hidden flex-grow flex flex-col items-center justify-center p-8 max-w-5xl mx-auto w-full">
        <div class="w-full text-center mb-12">
            <h2 id="practiceTitle" class="text-6xl font-black text-white uppercase tracking-tighter mb-8 italic">Kata</h2>
            <p id="practiceWeak" class="text-3xl md:text-4xl font-medium text-slate-500 italic leading-tight px-10 mb-12"></p>
        </div>
        <div id="inputArea" class="w-full max-w-4xl flex flex-col items-center gap-6">
            <div class="flex w-full gap-4">
                <input type="text" id="userInput" placeholder="Strike here..." class="flex-grow bg-slate-900 border-2 border-white/10 text-white text-2xl p-8 rounded-[2rem] text-center focus:border-blue-500 outline-none transition-colors" autocomplete="off">
                <button onclick="forge()" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-xl uppercase px-12 rounded-[2rem] border-b-8 border-blue-800 active:border-b-0 active:translate-y-2 transition-all shadow-xl">Slice</button>
            </div>

            <!-- CHEAT SHEET SECTION -->
            <div class="flex flex-col items-center gap-4 w-full mt-4">
                <button onclick="toggleCheatSheet()" class="text-sm font-bold uppercase tracking-[0.3em] text-slate-500 hover:text-amber-400 transition-colors flex items-center gap-3">
                    <i class="fa-solid fa-lightbulb text-amber-400"></i> <span id="cheatBtnLabel">Show Cheat Sheet</span>
                </button>
                <div id="hintArea" class="hidden w-full max-w-3xl hint-card rounded-[2.5rem] p-8 shadow-2xl">
                    <div class="text-center">
                        <h4 class="text-blue-400 font-black uppercase tracking-[0.2em] mb-2 text-xs">Sensei's Formula</h4>
                        <p id="hintFormula" class="text-slate-300 italic font-bold text-lg mb-4"></p>
                        <h4 class="text-blue-400 font-black uppercase tracking-[0.2em] mb-2 text-xs">Example</h4>
                        <p id="hintExample" class="text-slate-400 italic text-sm"></p>
                    </div>
                </div>
            </div>
        </div>
        <div id="successArea" class="hidden flex flex-col items-center gap-8 mt-12">
            <h3 class="text-5xl font-black text-emerald-400 uppercase italic">Clean Strike!</h3>
            <button onclick="nextDrill()" class="bg-slate-800 hover:bg-slate-700 text-white font-black py-5 px-16 rounded-2xl text-2xl flex items-center gap-4 transition shadow-2xl border border-white/10">Next Target <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </main>

    <!-- STAGE 3: MASTER APPLICATION -->
    <main id="masterStage" class="hidden flex-grow flex flex-col items-center justify-center p-8 w-full max-w-6xl mx-auto">
        <div class="text-center mb-12">
            <p class="text-amber-400 text-2xl font-black uppercase tracking-[0.4em] mb-4 italic">Kata Unlocked</p>
            <h2 class="text-6xl font-black text-white uppercase tracking-tighter italic">Applied Syntax</h2>
        </div>
        <div class="relative w-full max-w-5xl bg-slate-900/40 p-16 rounded-[3rem] overflow-hidden border border-white/10 shadow-2xl min-h-[350px]">
            <div id="paragraphContent" class="text-3xl md:text-4xl leading-relaxed text-slate-300"></div>
            <div id="ninjaCover" class="absolute inset-0 bg-slate-950 z-10 border-l-8 border-blue-500 shadow-[-40px_0_60px_#020617] translate-x-0 hidden"></div>
        </div>
        <div id="masterInputArea" class="hidden w-full max-w-4xl mt-12 flex flex-col items-center">
            <p class="text-2xl text-slate-400 mb-6 font-bold text-center">Complete the paragraph using the <span id="masterInstruction" class="text-blue-400 uppercase font-black"></span> structure:</p>
            <div class="flex w-full gap-4">
                <input type="text" id="masterInput" placeholder="Forge the final sentence..." class="flex-grow bg-slate-900 border-2 border-white/10 text-white text-3xl p-8 rounded-[2rem] text-center focus:border-blue-500 outline-none transition-all shadow-2xl" autocomplete="off">
                <button onclick="forgeMaster()" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-xl uppercase px-12 rounded-[2rem] border-b-8 border-blue-800 transition-all shadow-xl">Execute</button>
            </div>
        </div>
        <div id="completionArea" class="hidden flex flex-col items-center mt-12 gap-8">
            <h3 class="text-6xl font-black text-emerald-400 italic uppercase drop-shadow-2xl">Kata Mastered!</h3>
            <button onclick="saveAndReturn()" class="bg-slate-800 hover:bg-slate-700 text-white font-black py-6 px-20 rounded-3xl text-2xl border border-white/10 transition shadow-2xl shadow-emerald-900/20">Return to Dojo</button>
        </div>
    </main>

    <script src="content.js"></script>
    <script>
        const currentUnitKey = localStorage.getItem('dojo_current_unit') || 'unit1';
        const unitData = typeof DOJO_DATA !== 'undefined' ? DOJO_DATA[currentUnitKey] : { katana: [] };
        const KATANAS = unitData.katana || [];
        
        let activeKata = null; 
        let index = 0; 
        let streak = 0;

        function renderGrid() {
            const grid = document.getElementById('katanaGrid');
            if(!KATANAS || KATANAS.length === 0) { grid.innerHTML = `<p class='text-rose-500 col-span-4 font-bold p-10 bg-rose-500/10 rounded-2xl border border-rose-500/30'>Error: Brain not synchronized. Ensure katana data exists in content.js.</p>`; return; }
            grid.innerHTML = KATANAS.map((k, i) => `
                <div class="katana-card group" onclick="startKata(${i})">
                    <div class="card-content-wrapper">
                        <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center mb-4 group-hover:bg-blue-500 group-hover:text-white transition-all shadow-lg group-hover:rotate-12"><i class="fa-solid fa-khanda text-3xl"></i></div>
                        <h3 class="text-xl font-black text-white mb-2 uppercase tracking-tight">${k.title}</h3>
                        <p class="text-blue-300 text-[10px] font-bold uppercase tracking-widest italic px-4">${k.formula}</p>
                    </div>
                </div>
            `).join('');
        }

        function startKata(i) {
            activeKata = KATANAS[i]; 
            index = 0;
            document.getElementById('selectionStage').classList.add('hidden');
            document.getElementById('practiceStage').classList.remove('hidden');
            document.getElementById('practiceTitle').innerText = activeKata.title;
            document.getElementById('hintFormula').innerText = activeKata.formula;
            document.getElementById('hintExample').innerText = activeKata.example;
            loadDrill();
        }

        function loadDrill() {
            document.getElementById('practiceWeak').innerText = `"${activeKata.drills[index]}"`;
            document.getElementById('userInput').value = "";
            document.getElementById('inputArea').classList.remove('hidden');
            document.getElementById('successArea').classList.add('hidden');
            document.getElementById('hintArea').classList.add('hidden');
            document.getElementById('cheatBtnLabel').innerText = "Show Cheat Sheet";
            setTimeout(() => document.getElementById('userInput').focus(), 100);
        }

        function forge() {
            const val = document.getElementById('userInput').value.trim();
            if(!val) return;
            
            document.getElementById('practiceWeak').innerHTML = `<span class="forged-text">"${val}"</span>`;
            document.getElementById('inputArea').classList.add('hidden');
            document.getElementById('successArea').classList.remove('hidden');
            
            streak++; 
            document.getElementById('streakCounter').innerText = streak;
        }

        function toggleCheatSheet() {
            const hint = document.getElementById('hintArea');
            const label = document.getElementById('cheatBtnLabel');
            hint.classList.toggle('hidden');
            label.innerText = hint.classList.contains('hidden') ? "Show Cheat Sheet" : "Hide Cheat Sheet";
        }

        function nextDrill() {
            index++;
            if (index < activeKata.drills.length) {
                loadDrill();
            } else {
                showMaster();
            }
        }

        function showMaster() {
            document.getElementById('practiceStage').classList.add('hidden');
            document.getElementById('masterStage').classList.remove('hidden');
            document.getElementById('paragraphContent').innerHTML = activeKata.paragraph;
            document.getElementById('masterInstruction').innerText = activeKata.title;
            
            const cover = document.getElementById('ninjaCover');
            cover.classList.remove('hidden');
            
            setTimeout(() => {
                cover.classList.add('animate-slice-open');
                setTimeout(() => {
                    cover.classList.add('hidden');
                    document.getElementById('masterInputArea').classList.remove('hidden');
                    document.getElementById('masterInput').focus();
                }, 2500);
            }, 500);
        }

        function forgeMaster() {
            const val = document.getElementById('masterInput').value.trim();
            if (!val) return;
            
            const target = document.getElementById('p-target');
            if (target) {
                target.innerHTML = val;
                target.className = "bg-emerald-500 text-slate-950 font-black italic px-2 py-1 rounded-lg shadow-[0_0_15px_rgba(16,185,129,0.4)] transition-all";
            }
            
            document.getElementById('masterInputArea').classList.add('hidden');
            document.getElementById('completionArea').classList.remove('hidden');
        }

        function saveAndReturn() {
            localStorage.setItem(`dojo_done_${currentUnitKey}_katana`, 'true');
            window.location.href = 'dashboard.html';
        }

        window.onload = () => {
            renderGrid();
            
            const inputs = ['userInput', 'masterInput'];
            inputs.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            id === 'userInput' ? forge() : forgeMaster();
                        }
                    });
                }
            });
        };
    </script>
</body>
</html>
