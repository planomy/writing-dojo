<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Fold Path - Writing Dojo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; }

        /* Synchronized Ninja Wipe Animations */
        @keyframes ninjaSprint {
            0% { transform: translateX(-100%) translateY(-50%); }
            100% { transform: translateX(100vw) translateY(-50%); }
        }
        @keyframes sliceOpen {
            0% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }
        @keyframes wipeText {
            0% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }
        @keyframes textPop {
            0% { transform: scale(0.8); opacity: 0; filter: brightness(2); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }

        .animate-ninja-sprint { animation: ninjaSprint 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }
        .animate-slice-open { animation: sliceOpen 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }
        .animate-wipe-text { animation: wipeText 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }

        /* Path Specific UI */
        .path-card { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            transition: all 0.3s ease; 
            aspect-ratio: 1/1; 
            border-radius: 2rem; 
        }
        .path-card:hover { border-color: #a855f7; transform: translateY(-5px); background: rgba(168, 85, 247, 0.05); }

        .word-forged { 
            color: #a855f7; font-weight: 800; border-bottom: 3px solid #a855f7; font-style: italic; display: inline-block;
            animation: textPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }

        .glory-text { letter-spacing: 0.4em; line-height: 1.5; }
        .hint-card { background: #1e293b; border-left: 4px solid #a855f7; }
    </style>
</head>
<body class="h-screen flex flex-col selection:bg-purple-500">

    <nav class="h-[10vh] px-8 flex justify-between items-center bg-[#020617] border-b border-white/5 z-50">
        <button id="backBtn" onclick="handleBack()" class="text-slate-400 hover:text-white flex items-center gap-2 font-bold transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Back
        </button>
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-route text-purple-400"></i>
            <h1 class="text-xl font-black tracking-tighter uppercase italic">7-Fold Path</h1>
        </div>
        <div class="bg-slate-900 px-4 py-1 rounded-full border border-white/10 flex items-center gap-3">
            <span id="streakCounter" class="text-purple-400 font-black text-xl">0</span>
            <i class="fa-solid fa-fire text-amber-500"></i>
        </div>
    </nav>

    <main id="selectionStage" class="h-[90vh] flex flex-col items-center justify-center p-12 overflow-y-auto">
        <header class="text-center mb-12">
            <h2 class="text-5xl font-black text-white mb-4 uppercase italic">Attack the boredom</h2>
            <p class="text-slate-500 font-bold uppercase tracking-widest text-sm">Choose an archetype of the 7-fold path</p>
        </header>     
        <div id="pathGrid" class="grid grid-cols-2 md:grid-cols-4 gap-6 w-full max-w-6xl"></div>
    </main>

    <section id="topHalf" class="hidden h-[45vh] flex flex-col justify-start relative px-6 overflow-hidden bg-[#020617]">
        <div class="my-auto w-full max-w-6xl mx-auto text-center relative z-10">
            <h2 id="modeTitle" class="text-purple-500 text-lg font-black uppercase tracking-[0.4em] mb-6 opacity-70">Path Practice</h2>
            <div id="mainDisplay" class="text-3xl md:text-4xl lg:text-5xl font-medium leading-tight text-slate-100 min-h-[150px] flex items-center justify-center">
                <div id="textContent" class="w-full"></div>
            </div>
        </div>

        <div id="ninjaCover" class="hidden absolute inset-0 bg-[#020617] z-40 flex items-center justify-center overflow-hidden">
            <div id="gloryTextContainer" class="absolute text-center z-10">
                <h3 class="glory-text text-6xl font-black text-white uppercase italic">PREPARE FOR GLORY</h3>
            </div>
            <div id="wipeMask" class="absolute inset-0 bg-[#020617] z-20"></div>
            <div id="ninjaRunner" class="absolute left-0 top-1/2 text-purple-500 text-9xl z-[60]"><i class="fa-solid fa-user-ninja"></i></div>
            <div id="slicePanel" class="absolute inset-0 bg-[#020617] border-l-8 border-purple-500 z-50"></div>
        </div>
    </section>

    <section id="bottomHalf" class="hidden h-[45vh] flex flex-col items-center justify-start bg-slate-950 border-t border-white/10 p-10 relative z-20">
        <div id="interactionArea" class="w-full max-w-4xl flex flex-col items-center gap-8">
            <p id="instructionLabel" class="text-xl text-slate-400 font-bold">Forge using the <span id="targetWordLabel" class="text-purple-400 uppercase tracking-widest">---</span> archetype:</p>
            
            <div id="inputGroup" class="flex w-full gap-4">
                <input type="text" id="userInput" placeholder="Strike with the archetype..." class="flex-grow bg-slate-900 border-2 border-white/10 text-white text-3xl p-6 rounded-2xl text-center focus:border-purple-500 outline-none transition-all" autocomplete="off">
                <button onclick="processInput()" class="bg-purple-600 hover:bg-purple-500 text-white border-b-8 border-purple-800 active:border-b-0 active:translate-y-1 transition-all rounded-2xl px-12"><i class="fa-solid fa-route text-3xl"></i></button>
            </div>

            <button id="nextBtn" onclick="loadNextDrill()" class="hidden w-full bg-amber-500 hover:bg-amber-400 text-[#020617] text-3xl font-black py-6 rounded-2xl uppercase shadow-xl transition-transform hover:scale-105">Next Target <i class="fa-solid fa-arrow-right ml-2"></i></button>
            <button id="proceedBtn" onclick="triggerNinjaSprint()" class="hidden w-full bg-purple-500 hover:bg-purple-400 text-[#020617] text-3xl font-black py-6 rounded-2xl uppercase shadow-2xl transition-transform hover:scale-105">TRAINING OVER - PROCEED <i class="fa-solid fa-chevron-right ml-2"></i></button>

            <div class="w-full flex flex-col items-center min-h-[140px]">
                <button onclick="toggleCheatSheet()" class="text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-amber-400 py-2 transition-colors">
                    <i class="fa-solid fa-lightbulb mr-2"></i> <span id="cheatBtnText">Open Cheat Sheet</span>
                </button>
                <div id="hintArea" class="opacity-0 pointer-events-none w-full bg-slate-900 border border-white/5 p-8 rounded-xl transition-opacity duration-300">
                    <div class="text-center">
                        <p id="hintFormula" class="text-purple-400 font-black uppercase text-xs mb-2"></p>
                        <p id="hintExample" class="text-slate-300 italic text-lg"></p>
                    </div>
                </div>
            </div>
        </div>

        <div id="masteryScreen" class="hidden absolute inset-0 bg-purple-600 flex flex-col items-center justify-center z-[100] text-center">
            <h2 class="text-8xl font-black text-white mb-8 tracking-tighter uppercase">PATH MASTERED!</h2>
            <button onclick="saveAndReturn()" class="bg-[#020617] text-white font-black px-20 py-8 rounded-full text-3xl border-4 border-purple-400 shadow-2xl transition-transform hover:scale-105">RETURN TO DOJO</button>
        </div>
    </section>

    <script src="content.js"></script>
    <script>
        const currentUnitKey = localStorage.getItem('dojo_current_unit') || 'unit1';
        const unitData = typeof DOJO_DATA !== 'undefined' ? DOJO_DATA[currentUnitKey] : { path7: [] };
        const PATHS = unitData.path7;
        
        let activePath = null; let drillIndex = -1; let streak = 0;
        let isMasterScroll = false;

        function renderGrid() {
            const grid = document.getElementById('pathGrid');
            grid.innerHTML = PATHS.map((p, i) => `
                <div class="path-card flex flex-col items-center justify-center p-6 text-center cursor-pointer" onclick="startPath(${i})">
                    <div class="text-purple-400 text-3xl mb-4"><i class="fa-solid fa-route"></i></div>
                    <h3 class="text-lg font-black text-white uppercase tracking-tighter">${p.title}</h3>
                    <p class="text-purple-300/60 text-[10px] font-bold uppercase mt-2">${p.formula}</p>
                </div>
            `).join('');
        }

        function handleBack() {
            if (!document.getElementById('selectionStage').classList.contains('hidden')) {
                window.location.href = 'dashboard.html';
            } else {
                location.reload();
            }
        }

        function startPath(i) {
            activePath = PATHS[i]; drillIndex = -1;
            document.getElementById('selectionStage').classList.add('hidden');
            document.getElementById('topHalf').classList.remove('hidden');
            document.getElementById('bottomHalf').classList.remove('hidden');
            document.getElementById('hintFormula').innerText = `Formula: ${activePath.formula}`;
            document.getElementById('hintExample').innerText = `Example: ${activePath.example}`;
            loadNextDrill();
        }

        function loadNextDrill() {
            drillIndex++;
            if (drillIndex >= activePath.drills.length) drillIndex = 0;
            document.getElementById('textContent').innerHTML = `<span class="text-slate-500 italic">${activePath.drills[drillIndex]}</span>`;
            document.getElementById('targetWordLabel').innerText = activePath.title;
            resetUI();
        }

        function resetUI() {
            document.getElementById('inputGroup').classList.remove('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('proceedBtn').classList.add('hidden');
            document.getElementById('instructionLabel').style.opacity = "1";
            document.getElementById('userInput').value = ''; document.getElementById('userInput').focus();
        }

        function processInput() {
            const val = document.getElementById('userInput').value.trim(); if (!val) return;
            const target = isMasterScroll ? document.getElementById('p-target') : document.getElementById('textContent');
            
            target.innerHTML = `<span class="word-forged px-2">${val}</span>`;
            
            streak++; document.getElementById('streakCounter').innerText = streak;

            if (isMasterScroll) {
                localStorage.setItem('dojo_pending_reward', '100');
                document.getElementById('masteryScreen').classList.remove('hidden');
            } else {
                document.getElementById('inputGroup').classList.add('hidden');
                document.getElementById('instructionLabel').style.opacity = "0";
                if (streak >= 5) document.getElementById('proceedBtn').classList.remove('hidden');
                else document.getElementById('nextBtn').classList.remove('hidden');
            }
        }

        function triggerNinjaSprint() {
            const cover = document.getElementById('ninjaCover');
            cover.classList.remove('hidden');
            document.getElementById('ninjaRunner').classList.add('animate-ninja-sprint');
            document.getElementById('slicePanel').classList.add('animate-slice-open');
            document.getElementById('wipeMask').classList.add('animate-wipe-text');

            setTimeout(() => {
                isMasterScroll = true;
                document.getElementById('modeTitle').innerText = "Applied Narrative";
                document.getElementById('modeTitle').classList.replace('text-purple-500', 'text-amber-500');
                document.getElementById('textContent').innerHTML = `<div class="text-4xl md:text-5xl text-left max-w-7xl mx-auto leading-relaxed text-slate-300">${activePath.paragraph}</div>`;
                resetUI();
            }, 1000);
            setTimeout(() => { cover.classList.add('hidden'); }, 2100);
        }

        function toggleCheatSheet() {
            const hint = document.getElementById('hintArea');
            const isHidden = hint.classList.contains('opacity-0');
            hint.classList.toggle('opacity-0', !isHidden);
            hint.classList.toggle('pointer-events-none', !isHidden);
            document.getElementById('cheatBtnText').innerText = isHidden ? 'Close Cheat Sheet' : 'Open Cheat Sheet';
        }

        function saveAndReturn() {
            localStorage.setItem(`dojo_done_${currentUnitKey}_path`, 'true');
            localStorage.setItem("dojo_pending_reward", 100); 
            window.location.href = 'dashboard.html';
        }

        window.onload = () => {
            renderGrid();
            document.getElementById('userInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') processInput();
            });
        };
    </script>
</body>
</html>
